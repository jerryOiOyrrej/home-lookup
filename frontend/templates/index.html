<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 Marseille Immo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="apple-touch-icon" href="/img/static-logo-512.png">
    <meta name="theme-color" content="#1e40af">
    <style>
        [x-cloak] { display: none !important; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
        /* Photo placeholder */
        .photo-placeholder {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8; font-size: 2rem;
        }
        /* Touch-friendly buttons */
        @media (max-width: 640px) {
            .btn-touch { min-height: 44px; min-width: 44px; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen" x-data="app()" x-init="init()">

<!-- Header — compact on mobile -->
<header class="bg-blue-800 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <h1 class="text-lg sm:text-xl font-bold">🏠 Marseille Immo</h1>
        </div>
        <div class="flex items-center gap-2 sm:gap-3">
            <!-- Stats pills — hidden on small mobile -->
            <div class="hidden sm:flex gap-2 text-xs">
                <div class="bg-white/20 px-2 py-1 rounded-full">
                    <span class="font-semibold" x-text="stats?.total || 0"></span> annonces
                </div>
                <div class="bg-white/20 px-2 py-1 rounded-full">
                    Score moy. <span class="font-semibold" x-text="stats?.score_moyen || '-'"></span>
                </div>
            </div>
            <button @click="showAddModal = true" class="bg-white text-blue-800 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm font-semibold hover:bg-blue-50 btn-touch">
                ➕ <span class="hidden sm:inline">Ajouter</span>
            </button>
        </div>
    </div>
</header>

<!-- Filtres — horizontal scroll on mobile -->
<div class="sticky top-[52px] sm:top-[56px] z-30 bg-white border-b shadow-sm">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-2.5">
        <div class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1 scrollbar-hide">
            <select x-model="filters.statut" @change="loadAnnonces()" class="rounded-lg border-gray-300 text-sm py-1.5 px-2 flex-shrink-0 btn-touch">
                <option value="sans_ecarte">Sauf écartés</option>
                <option value="">Tous</option>
                <option value="nouveau">🆕 Nouveau</option>
                <option value="interessant">⭐ Intéressant</option>
                <option value="a_visiter">📍 À visiter</option>
                <option value="visite">✅ Visité</option>
                <option value="offre">💰 Offre</option>
                <option value="ecarte">❌ Écarté</option>
            </select>
            <select x-model="filters.arrondissement" @change="loadAnnonces()" class="rounded-lg border-gray-300 text-sm py-1.5 px-2 flex-shrink-0 btn-touch">
                <option value="">Arr.</option>
                <option value="4e">4e</option>
                <option value="5e">5e</option>
                <option value="6e">6e</option>
                <option value="7e">7e</option>
                <option value="8e">8e</option>
            </select>
            <select x-model="filters.prix_max" @change="loadAnnonces()" class="rounded-lg border-gray-300 text-sm py-1.5 px-2 flex-shrink-0 btn-touch">
                <option value="">Prix max</option>
                <option value="900000">900k</option>
                <option value="1000000">1M</option>
                <option value="1200000">1.2M</option>
                <option value="1500000">1.5M</option>
            </select>
            <select x-model="filters.score_min" @change="loadAnnonces()" class="rounded-lg border-gray-300 text-sm py-1.5 px-2 flex-shrink-0 btn-touch">
                <option value="">Score</option>
                <option value="70">70+</option>
                <option value="60">60+</option>
                <option value="50">50+</option>
            </select>
            <select x-model="filters.sort_by" @change="loadAnnonces()" class="rounded-lg border-gray-300 text-sm py-1.5 px-2 flex-shrink-0 btn-touch">
                <option value="score">Tri: Score</option>
                <option value="prix">Tri: Prix</option>
                <option value="surface_m2">Tri: Surface</option>
                <option value="prix_m2">Tri: €/m²</option>
                <option value="first_seen_at">Tri: Date</option>
            </select>
        </div>
    </div>
</div>

<!-- Stats bar mobile only -->
<div class="sm:hidden bg-blue-50 px-3 py-2 flex justify-around text-xs text-blue-800 font-medium">
    <span><span class="font-bold" x-text="stats?.total || 0"></span> annonces</span>
    <span>Score moy. <span class="font-bold" x-text="stats?.score_moyen || '-'"></span></span>
    <span>Prix moy. <span class="font-bold" x-text="formatPrixShort(stats?.prix_moyen)"></span></span>
</div>

<!-- Liste des annonces -->
<div class="max-w-7xl mx-auto px-2 sm:px-4 py-3 sm:py-4">
    <div class="grid gap-3 sm:gap-4">
        <template x-for="a in annonces" :key="a.id">
            <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow overflow-hidden border-l-4"
                 :class="borderColor(a.score)">
                
                <!-- Card layout: photo + content -->
                <div class="flex flex-col sm:flex-row">
                    
                    <!-- Photo -->
                    <div class="sm:w-48 sm:flex-shrink-0">
                        <template x-if="a.photos && a.photos.length > 0">
                            <a :href="a.url" target="_blank" class="block">
                                <img :src="a.photos[0]" :alt="a.titre" 
                                     class="w-full h-44 sm:h-full object-cover cursor-pointer"
                                     loading="lazy"
                                     onerror="this.parentElement.innerHTML='<div class=\'photo-placeholder w-full h-44 sm:h-full\'>🏠</div>'">
                            </a>
                        </template>
                        <template x-if="!a.photos || a.photos.length === 0">
                            <a :href="a.url" target="_blank" class="block photo-placeholder w-full h-32 sm:h-full">🏠</a>
                        </template>
                    </div>

                    <!-- Content -->
                    <div class="flex-1 p-3 sm:p-4 min-w-0">
                        <div class="flex justify-between items-start gap-2">
                            <div class="min-w-0 flex-1">
                                <!-- Badges -->
                                <div class="flex flex-wrap items-center gap-1.5 mb-1.5">
                                    <span class="text-xs px-2 py-0.5 rounded-full font-medium"
                                          :class="statutBadge(a.statut)" x-text="statutLabel(a.statut)"></span>
                                    <span class="text-xs text-gray-400" x-text="a.arrondissement + 'e'" x-show="a.arrondissement"></span>
                                    <span class="text-xs text-gray-400 truncate max-w-[150px]" x-text="a.quartier" x-show="a.quartier"></span>
                                </div>
                                <!-- Title -->
                                <h3 class="font-semibold text-gray-900 text-sm sm:text-base line-clamp-2 leading-snug" x-text="a.titre"></h3>
                            </div>
                            <!-- Score -->
                            <div class="text-right flex-shrink-0">
                                <div class="text-2xl font-bold leading-none" :class="scoreColor(a.score)">
                                    <span x-text="a.score"></span>
                                </div>
                                <div class="text-[10px] text-gray-400">/100</div>
                            </div>
                        </div>

                        <!-- Price & key info -->
                        <div class="flex flex-wrap items-baseline gap-x-3 gap-y-0.5 mt-2">
                            <span class="text-lg sm:text-xl font-bold text-gray-900" x-text="formatPrix(a.prix)"></span>
                            <span class="text-xs text-gray-500" x-text="formatPrix(a.prix_m2) + '/m²'"></span>
                        </div>

                        <!-- Features pills -->
                        <div class="flex flex-wrap gap-1.5 mt-2">
                            <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full">📐 <span x-text="a.surface_m2"></span>m²</span>
                            <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full">🏠 <span x-text="a.nb_pieces"></span>P</span>
                            <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full" x-show="a.nb_chambres">🛏 <span x-text="a.nb_chambres"></span>Ch</span>
                            <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full" x-show="a.terrasse">🌿 Terrasse</span>
                            <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full" x-show="a.cave">📦 Cave</span>
                            <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full" x-show="a.parking">🅿️</span>
                            <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full" x-show="a.ascenseur">🛗</span>
                            <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full" x-show="a.traversant">↔️</span>
                            <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full" x-show="a.dpe">DPE <span x-text="a.dpe"></span></span>
                        </div>

                        <!-- Description (collapsed) -->
                        <p class="text-xs text-gray-500 mt-2 line-clamp-2" x-text="a.description" x-show="a.description"></p>

                        <!-- Commentaire -->
                        <div class="mt-2" x-show="a.commentaire && !a._editComment">
                            <div class="text-xs bg-amber-50 border border-amber-200 rounded-lg p-2 text-amber-800 line-clamp-3 whitespace-pre-line" x-text="a.commentaire"></div>
                        </div>
                        <div class="mt-2" x-show="a._editComment">
                            <textarea class="w-full text-xs border rounded-lg p-2" rows="2" x-model="a._commentDraft" placeholder="Ajouter un commentaire..."></textarea>
                            <div class="flex gap-1 mt-1">
                                <button @click="saveComment(a)" class="text-xs bg-blue-600 text-white px-3 py-1 rounded-lg btn-touch">💾 Sauver</button>
                                <button @click="a._editComment = false" class="text-xs bg-gray-200 px-3 py-1 rounded-lg btn-touch">✕</button>
                            </div>
                        </div>

                        <!-- Contact -->
                        <div class="flex gap-3 text-xs text-gray-500 mt-1.5" x-show="a.contact_email || a.contact_telephone">
                            <a x-show="a.contact_telephone" :href="'tel:' + a.contact_telephone" class="text-blue-600 hover:underline">📞 <span x-text="a.contact_telephone"></span></a>
                            <a x-show="a.contact_email" :href="'mailto:' + a.contact_email" class="text-blue-600 hover:underline">📧 <span x-text="a.contact_email"></span></a>
                        </div>

                        <!-- Actions — scrollable on mobile -->
                        <div class="flex gap-1.5 mt-3 pt-2.5 border-t overflow-x-auto -mx-1 px-1">
                            <a :href="a.url" target="_blank" class="text-xs bg-blue-50 text-blue-700 px-3 py-1.5 rounded-lg hover:bg-blue-100 whitespace-nowrap btn-touch font-medium">🔗 Annonce</a>
                            <button @click="updateStatut(a.id, 'interessant')" class="text-xs bg-green-50 text-green-700 px-3 py-1.5 rounded-lg hover:bg-green-100 whitespace-nowrap btn-touch">⭐</button>
                            <button @click="updateStatut(a.id, 'a_visiter')" class="text-xs bg-purple-50 text-purple-700 px-3 py-1.5 rounded-lg hover:bg-purple-100 whitespace-nowrap btn-touch">📍</button>
                            <button @click="a._editComment = true; a._commentDraft = a.commentaire || ''" class="text-xs bg-gray-50 text-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-100 whitespace-nowrap btn-touch">💬</button>
                            <button @click="editContactPrompt(a)" class="text-xs bg-gray-50 text-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-100 whitespace-nowrap btn-touch">📇</button>
                            <button @click="ecarterPrompt(a.id)" class="text-xs bg-red-50 text-red-700 px-3 py-1.5 rounded-lg hover:bg-red-100 whitespace-nowrap btn-touch">❌</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <div x-show="annonces.length === 0" class="text-center py-16 text-gray-400">
        <div class="text-4xl mb-3">🔍</div>
        <p class="text-lg">Aucune annonce trouvée</p>
    </div>
</div>

<!-- Modal Ajouter par URL -->
<div x-show="showAddModal" x-cloak class="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-50" @click.self="showAddModal = false">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full sm:max-w-md p-5 sm:mx-4" @click.stop>
        <h2 class="text-lg font-bold mb-1">➕ Ajouter une annonce</h2>
        <p class="text-sm text-gray-500 mb-4">Colle l'URL, je m'occupe du reste 🪞</p>
        <input type="url" x-model="addForm.url" @keydown.enter="submitAdd()" placeholder="https://www.bienici.com/annonce/..." class="w-full border-2 border-gray-200 focus:border-blue-400 rounded-xl px-4 py-3 text-base btn-touch" autofocus>
        <div class="flex justify-end gap-2 mt-4">
            <button @click="showAddModal = false" class="px-4 py-2.5 text-sm text-gray-600 hover:bg-gray-100 rounded-xl btn-touch">Annuler</button>
            <button @click="submitAdd()" :disabled="addLoading" class="px-5 py-2.5 text-sm bg-blue-600 text-white rounded-xl hover:bg-blue-700 disabled:opacity-50 font-medium btn-touch">
                <span x-show="!addLoading">🔍 Ajouter</span>
                <span x-show="addLoading">⏳ Scraping...</span>
            </button>
        </div>
        <div x-show="addError" class="mt-3 text-sm text-red-600 bg-red-50 p-3 rounded-xl" x-text="addError"></div>
        <div x-show="addSuccess" class="mt-3 text-sm text-green-600 bg-green-50 p-3 rounded-xl" x-text="addSuccess"></div>
    </div>
</div>

<script>
function app() {
    return {
        annonces: [],
        stats: null,
        showAddModal: false,
        addLoading: false,
        addError: '',
        addSuccess: '',
        addForm: { url: '' },
        filters: {
            statut: 'sans_ecarte',
            arrondissement: '',
            prix_max: '',
            score_min: '',
            sort_by: 'score',
        },

        async init() {
            await this.loadAnnonces();
            await this.loadStats();
        },

        async loadAnnonces() {
            const params = new URLSearchParams();
            if (this.filters.statut && this.filters.statut !== 'sans_ecarte') params.set('statut', this.filters.statut);
            if (this.filters.statut === 'sans_ecarte') params.set('exclude_ecarte', 'true');
            if (this.filters.arrondissement) params.set('arrondissement', this.filters.arrondissement);
            if (this.filters.prix_max) params.set('prix_max', this.filters.prix_max);
            if (this.filters.score_min) params.set('score_min', this.filters.score_min);
            if (this.filters.sort_by) params.set('sort_by', this.filters.sort_by);
            params.set('sort_order', 'desc');
            const res = await fetch(`/api/annonces?${params}`);
            const data = await res.json();
            this.annonces = data.annonces || [];
        },

        async loadStats() {
            const res = await fetch('/api/stats');
            this.stats = await res.json();
        },

        async updateStatut(id, statut) {
            await fetch(`/api/annonces/${id}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ statut }),
            });
            await this.loadAnnonces();
            await this.loadStats();
        },

        async saveComment(a) {
            await fetch(`/api/annonces/${a.id}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ commentaire: a._commentDraft }),
            });
            a.commentaire = a._commentDraft;
            a._editComment = false;
        },

        async editContactPrompt(a) {
            const email = prompt('Email de contact :', a.contact_email || '');
            if (email === null) return;
            const tel = prompt('Téléphone de contact :', a.contact_telephone || '');
            if (tel === null) return;
            await fetch(`/api/annonces/${a.id}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contact_email: email || null, contact_telephone: tel || null }),
            });
            a.contact_email = email || null;
            a.contact_telephone = tel || null;
        },

        async ecarterPrompt(id) {
            const raison = prompt('Raison ?');
            if (raison) {
                await fetch(`/api/annonces/${id}/ecarter?raison=${encodeURIComponent(raison)}`, { method: 'POST' });
                await this.loadAnnonces();
                await this.loadStats();
            }
        },

        async submitAdd() {
            this.addError = '';
            this.addSuccess = '';
            const url = this.addForm.url.trim();
            if (!url) { this.addError = 'Colle une URL !'; return; }
            this.addLoading = true;
            try {
                const res = await fetch('/api/annonces/from-url', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Erreur serveur');
                this.addSuccess = `✅ Ajoutée ! Score: ${data.annonce?.score ?? '?'}/100`;
                await this.loadAnnonces();
                await this.loadStats();
                setTimeout(() => {
                    this.showAddModal = false;
                    this.addSuccess = '';
                    this.addForm = { url: '' };
                }, 1500);
            } catch (e) {
                this.addError = e.message;
            } finally {
                this.addLoading = false;
            }
        },

        formatPrix(prix) {
            if (!prix) return '-';
            return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(prix);
        },

        formatPrixShort(prix) {
            if (!prix) return '-';
            if (prix >= 1000000) return (prix / 1000000).toFixed(1) + 'M€';
            return Math.round(prix / 1000) + 'k€';
        },

        scoreColor(score) {
            if (score >= 70) return 'text-green-600';
            if (score >= 50) return 'text-yellow-600';
            return 'text-red-500';
        },

        borderColor(score) {
            if (score >= 70) return 'border-green-400';
            if (score >= 50) return 'border-yellow-400';
            return 'border-red-300';
        },

        statutBadge(statut) {
            const map = {
                nouveau: 'bg-blue-100 text-blue-700',
                interessant: 'bg-green-100 text-green-700',
                a_visiter: 'bg-purple-100 text-purple-700',
                visite: 'bg-teal-100 text-teal-700',
                offre: 'bg-yellow-100 text-yellow-700',
                ecarte: 'bg-red-100 text-red-700',
            };
            return map[statut] || 'bg-gray-100 text-gray-700';
        },

        statutLabel(statut) {
            const map = {
                nouveau: '🆕 Nouveau',
                interessant: '⭐ Intéressant',
                a_visiter: '📍 À visiter',
                visite: '✅ Visité',
                offre: '💰 Offre',
                ecarte: '❌ Écarté',
            };
            return map[statut] || statut;
        },
    }
}
</script>
</body>
</html>
